modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://discord.gg/zMsHAf3RK6"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
credits="Original Techguns mod by pWn3d_1337 (https://www.curseforge.com/minecraft/mc-mods/techguns). Ported to 1.20.1 by Numek with the permission of pWn3d_1337."
displayURL="https://discord.gg/zMsHAf3RK6"
description='''UNOFFICIAL port of Techguns 2 to Minecraft 1.20.1 Forge, not affiliated with nor supported by the original authors.
Original mod: Techguns by pWn3d_1337 - https://www.curseforge.com/minecraft/mc-mods/techguns
Published with the permission of the original author. Port by Numek - support and bug reports: https://discord.gg/zMsHAf3RK6'''
logoFile="techguns_logo.png"

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# Optional integrations (lot M): Techguns runs without them
[[dependencies.${mod_id}]]
    modId="jei"
    mandatory=false
    versionRange="[15.0,)"
    ordering="NONE"
    side="CLIENT"

[[dependencies.${mod_id}]]
    modId="patchouli"
    mandatory=false
    versionRange="*"
    ordering="NONE"
    side="BOTH"
